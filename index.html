let exporting = false;

function blankLines(Paragraph, count = 2) {
  return Array.from({ length: count }, () => new Paragraph({
    text: '________________________________________________________________________________',
    spacing: { after: 180 },
  }));
}

function makeDocx(api, title, children) {
  const { Document, Paragraph, TextRun, Footer, AlignmentType, PageNumber } = api;
  return new Document({
    creator: 'Personal Reset',
    title,
    styles: {
      default: { document: { run: { font: 'Calibri', size: 24, color: '24382D' }, paragraph: { spacing: { after: 180, line: 360 } } } },
      title: { run: { font: 'Cambria', size: 54, bold: true, color: '3F604B' }, paragraph: { spacing: { after: 300 } } },
      heading1: { run: { font: 'Cambria', size: 34, bold: true, color: '3F604B' }, paragraph: { spacing: { before: 200, after: 180 } } },
      heading2: { run: { font: 'Cambria', size: 28, bold: true, color: '3F604B' }, paragraph: { spacing: { before: 240, after: 120 } } },
    },
    sections: [{
      properties: { page: { margin: { top: 1080, right: 1080, bottom: 1080, left: 1080 } } },
      footers: { default: new Footer({ children: [new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ children: ['Personal Reset · ', PageNumber.CURRENT], size: 20, color: '5C675E' })] })] }) },
      children,
    }],
  });
}

function questionsDocument(api) {
  const { Paragraph, TextRun, HeadingLevel } = api;
  const total = categories.reduce((sum, section) => sum + section[2].length, 0);
  const children = [
    new Paragraph({ text: 'Personal Reset', heading: HeadingLevel.TITLE }),
    new Paragraph({ text: total + ' Questions to Help You Figure Out What You Want in Life', heading: HeadingLevel.HEADING_1 }),
    new Paragraph({ text: categories.length + ' sections · ' + total + ' reflection prompts', spacing: { after: 320 } }),
    new Paragraph({ text: 'Answer honestly, at your own pace. You do not have to answer every question in one sitting.' }),
  ];
  let number = 0;
  categories.forEach(([title, description, questions], sectionIndex) => {
    children.push(new Paragraph({ text: 'Part ' + (sectionIndex + 1) + '. ' + title, heading: HeadingLevel.HEADING_1, pageBreakBefore: true, keepNext: true }));
    children.push(new Paragraph({ children: [new TextRun({ text: description, italics: true, color: '4D5D51' })], spacing: { after: 320 }, keepNext: true }));
    questions.forEach(question => {
      number++;
      children.push(new Paragraph({ children: [new TextRun({ text: number + '. ', bold: true }), new TextRun(question)], indent: { left: 540, hanging: 540 }, spacing: { after: 220, line: 360 }, keepLines: true }));
    });
  });
  return makeDocx(api, 'Personal Reset — ' + total + ' Questions', children);
}

function resetDocument(api) {
  const { Paragraph, TextRun, HeadingLevel } = api;
  const children = [
    new Paragraph({ text: 'Personal reset', heading: HeadingLevel.TITLE }),
    new Paragraph({ text: 'From reflection to action', heading: HeadingLevel.HEADING_1 }),
    new Paragraph({ text: 'You do not have to solve everything at once. Turn your answers into a practical plan, one small step at a time.', spacing: { after: 360 } }),
    new Paragraph({ text: 'Exercise 01 · Your five biggest opportunities', heading: HeadingLevel.HEADING_1 }),
    new Paragraph({ text: 'After answering the questions, identify five areas that deserve attention. Your list should reflect your own responses.' }),
  ];
  const suggestions = ['Financial', 'Physical', 'Professional', 'Personal', 'Relationships'];
  for (let i = 0; i < 5; i++) {
    children.push(new Paragraph({ text: 'Opportunity ' + (i + 1), heading: HeadingLevel.HEADING_2 }));
    children.push(new Paragraph({ children: [new TextRun({ text: 'Area: ', bold: true }), new TextRun(suggestions[i])], spacing: { after: 100 } }));
    children.push(new Paragraph({ children: [new TextRun({ text: 'What needs to change?', bold: true })], spacing: { after: 60 } }));
    children.push(...blankLines(Paragraph, 2));
  }
  children.push(new Paragraph({ text: 'Exercise 02 · Give change some time', heading: HeadingLevel.HEADING_1 }));
  children.push(new Paragraph({ text: 'These are starting points, not predetermined answers.' }));
  timeframes.forEach(([title, description, tasks]) => {
    children.push(new Paragraph({ text: title, heading: HeadingLevel.HEADING_2 }));
    children.push(new Paragraph({ children: [new TextRun({ text: description, italics: true })] }));
    tasks.forEach(task => children.push(new Paragraph({ children: [new TextRun({ text: '☐  ' + task })], indent: { left: 240 }, spacing: { after: 120 } })));
    children.push(new Paragraph({ text: 'My own next step:' }));
    children.push(...blankLines(Paragraph, 1));
  });
  children.push(new Paragraph({ text: 'Exercise 03 · Start with these ten', heading: HeadingLevel.HEADING_1 }));
  children.push(new Paragraph({ text: 'If answering all the questions feels like too much, start here. Get to the heart of the matter.', spacing: { after: 240 } }));
  firstTen.forEach((question, i) => {
    children.push(new Paragraph({ children: [new TextRun({ text: (i + 1) + '. ', bold: true }), new TextRun(question)], keepNext: true, spacing: { after: 80 } }));
    children.push(...blankLines(Paragraph, 2));
  });
  return makeDocx(api, 'Personal Reset', children);
}

function lifeDocument(api) {
  const { Paragraph, HeadingLevel } = api;
  const children = [
    new Paragraph({ text: 'The life I want', heading: HeadingLevel.TITLE }),
    new Paragraph({ text: 'My personal life inventory', heading: HeadingLevel.HEADING_1 }),
    new Paragraph({ text: 'Complete these sentences without overthinking them. In your own words, at your own pace.', spacing: { after: 360 } }),
  ];
  inventory.forEach((prompt, i) => {
    children.push(new Paragraph({ text: String(i + 1).padStart(2, '0') + '  ' + prompt, heading: HeadingLevel.HEADING_2, keepNext: true }));
    children.push(...blankLines(Paragraph, 3));
  });
  return makeDocx(api, 'The Life I Want', children);
}

function startDownload(url, filename) {
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  link.remove();
}

async function downloadQuestions(button, notify) {
  if (exporting) return;
  exporting = true;
  const originalLabel = button.textContent;
  button.disabled = true;
  button.textContent = 'Preparing Word documents…';
  button.setAttribute('aria-busy', 'true');
  const urls = [];
  try {
    const api = await import('https://esm.sh/docx@9.5.1?bundle');
    const docs = [
      ['personal-reset-questions.docx', questionsDocument(api)],
      ['personal-reset.docx', resetDocument(api)],
      ['the-life-i-want.docx', lifeDocument(api)],
    ];
    const blobs = await Promise.all(docs.map(([, doc]) => api.Packer.toBlob(doc)));
    docs.forEach(([filename], i) => {
      const url = URL.createObjectURL(blobs[i]);
      urls.push(url);
      startDownload(url, filename);
    });
    notify('Your 3 Word documents are downloading.');
  } catch (error) {
    console.error('Word export failed:', error);
    notify('Could not create the Word documents. Please check your connection and try again.');
  } finally {
    exporting = false;
    button.disabled = false;
    button.textContent = originalLabel;
    button.removeAttribute('aria-busy');
    setTimeout(() => urls.forEach(url => URL.revokeObjectURL(url)), 60000);
  }
}

 }else if(view==='inventory'){
  app.innerHTML='<section class="intro compact"><div class="eyebrow">ONE FINAL EXERCISE</div><h1>The life <em>I want.</em></h1><p>Complete these sentences without overthinking them.</p></section><section class="inventory-sheet"><div class="section-meta"><span>MY PERSONAL LIFE INVENTORY</span><span id="inventory-count">'+count('i',12)+' / 12 completed</span></div><div class="inventory-grid">'+inventory.map((q,i)=>'<label class="inventory-field"><span><small>'+String(i+1).padStart(2,'0')+'</small>'+q+'</span>'+field('i'+i,q,'Write your answer…')+'</label>').join('')+'</div><div class="copy-row"><span>In your own words. At your own pace.</span><button class="primary" id="copy">Copy my answers <span>↗</span></button></div></section>'+closing();
 }else if(view==='extra'){
  const section=extraPages[extraPart];const prefix='x'+extraPart+'-';
  app.innerHTML='<section class="intro compact extra-intro"><div class="eyebrow">MORE REFLECTIONS · '+String(extraPart+1).padStart(2,'0')+' OF '+extraPages.length+'</div><h1>'+section.title+'</h1><p>'+section.description+'</p></section><section class="extra-sheet"><div class="section-meta"><span>GUIDED EXERCISE</span><span id="extra-count">'+count(prefix,section.prompts.length)+' / '+section.prompts.length+' answered</span></div><div class="extra-prompts">'+section.prompts.map((prompt,i)=>'<label class="extra-field"><span><small>'+String(i+1).padStart(2,'0')+'</small>'+prompt+'</span>'+field(prefix+i,prompt,'Write your answer…')+'</label>').join('')+'</div><div class="page-nav"><button class="text-button" data-extra-prev '+(extraPart===0?'disabled':'')+'>← Previous reflection</button><button class="primary" data-extra-next>'+(extraPart===extraPages.length-1?'Back to questions':'Next reflection')+' <span>→</span></button></div></section>';
 }else{
  app.innerHTML='<section class="intro compact"><div class="eyebrow">FROM REFLECTION TO ACTION</div><h1>A personal <em>reset.</em></h1><p>You don’t have to solve everything at once.<br>Turn your answers into a practical plan, one small step at a time.</p></section><section class="reset-sheet"><div class="exercise"><div class="eyebrow">EXERCISE 01</div><h2>Your five biggest opportunities</h2><p>After answering the questions, identify five areas that deserve attention. Your list should reflect your own responses.</p><div class="opportunity-head"><span>Area</span><span>What needs to change?</span></div>'+Array.from({length:5},(_,i)=>'<div class="opportunity"><input data-key="area'+i+'" aria-label="Area '+(i+1)+'" placeholder="'+['Financial','Physical','Professional','Personal','Relationships'][i]+'" value="'+escape(state['area'+i]||'')+'">'+field('change'+i,'What needs to change in area '+(i+1),'What would better look like?')+'</div>').join('')+'</div><div class="exercise"><div class="eyebrow">EXERCISE 02</div><h2>Give change some time</h2><p>Not everything needs to happen immediately. These are starting points, not predetermined answers.</p><div class="timeframes">'+timeframes.map(([title,desc,tasks],i)=>'<div class="timeframe"><h3>'+title+'</h3><p>'+desc+'</p>'+tasks.map((task,j)=>'<label class="task"><input type="checkbox" data-key="task'+i+'-'+j+'" '+(state['task'+i+'-'+j]?'checked':'')+'><span>'+task+'</span></label>').join('')+'</div>').join('')+'</div></div><div class="exercise"><div class="eyebrow">EXERCISE 03</div><h2>Start with these ten</h2><p>If answering all '+totalQuestions+' feels like too much, start here. Get to the heart of the matter.</p>'+rows(firstTen,'s')+'</div><div class="page-nav"><span>Ready to put it into words?</span><button class="primary" data-go-inventory>The life I want →</button></div></section>';
 }
 const parts=app.querySelector('.parts');if(parts&&oldScroll){parts.scrollTop=oldScroll.top;parts.scrollLeft=oldScroll.left;}
 if(parts){const selected=parts.querySelector('.selected');const box=parts.getBoundingClientRect(),item=selected.getBoundingClientRect();if(window.innerWidth>800){if(item.bottom>box.bottom)parts.scrollTop+=item.bottom-box.bottom;else if(item.top<box.top)parts.scrollTop-=box.top-item.top;}else{if(item.right>box.right)parts.scrollLeft+=item.right-box.right;else if(item.left<box.left)parts.scrollLeft-=box.left-item.left;}}
}
function closing(){return '<div class="closing"><span class="closing-mark">✳</span><h2>You can start by making tomorrow<br><em>a little better than today.</em></h2><p>You do not have to fix your entire life to begin enjoying it again. You do not have to figure out the next ten years. You do not have to make every difficult decision today.</p><p>Then do it again the day after.<br>Eventually, those small decisions become a different life.</p></div>';}
function setMoreMenu(open){const button=document.querySelector('.more-toggle'),menu=document.querySelector('#more-menu');button.setAttribute('aria-expanded',String(open));menu.hidden=!open;}
function go(v){view=v;setMoreMenu(false);render();window.scrollTo({top:0,behavior:'smooth'});}
document.querySelector('#more-menu').innerHTML=extraPages.map((section,i)=>'<button type="button" data-extra="'+i+'"><span>'+String(i+1).padStart(2,'0')+'</span>'+section.short+'</button>').join('');
document.querySelector('nav').addEventListener('click',e=>{const extra=e.target.closest('[data-extra]');if(extra){extraPart=Number(extra.dataset.extra);go('extra');return;}const b=e.target.closest('[data-view]');if(b){go(b.dataset.view);return;}if(e.target.closest('.more-toggle'))setMoreMenu(document.querySelector('#more-menu').hidden);});
document.addEventListener('click',e=>{if(!e.target.closest('.more-wrap'))setMoreMenu(false);});
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='export-docx'){await downloadQuestions(b,notify);return;}if(b.dataset.part!==undefined){part=Number(b.dataset.part);render();return;}if(b.hasAttribute('data-prev')){part=Math.max(0,part-1);render();}if(b.hasAttribute('data-next')){if(part===categories.length-1)go('reset');else {part++;render();}}if(b.hasAttribute('data-extra-prev')){extraPart=Math.max(0,extraPart-1);render();}if(b.hasAttribute('data-extra-next')){if(extraPart===extraPages.length-1)go('questions');else{extraPart++;render();}}if(b.hasAttribute('data-go-inventory'))go('inventory');if(b.id==='copy'){const text='The life I want\n\n'+inventory.map((q,i)=>(i+1)+'. '+q+'\n'+(state['i'+i]||'')).join('\n\n');try{await navigator.clipboard.writeText(text);notify('Your answers have been copied.');}catch{notify('Copy is unavailable in this browser. Select your answers to copy them.');}}});
app.addEventListener('input',e=>{const el=e.target,key=el.dataset.key;if(!key)return;state[key]=el.type==='checkbox'?el.checked:el.value;try{localStorage.setItem('personal-reset-v1',JSON.stringify(state));document.querySelector('#save-status').textContent='Saved on this device';}catch{document.querySelector('#save-status').textContent='Unable to save on this device';}const d=el.closest('.question');if(d){d.classList.toggle('answered',answered(key));d.querySelector('.indicator').textContent=answered(key)?'✓':'+';}if(view==='questions'){document.querySelector('#total-count').textContent=count('q',totalQuestions)+' / '+totalQuestions;document.querySelector('#total-bar').style.width=(count('q',totalQuestions)/totalQuestions*100)+'%';categories.forEach((c,i)=>{const n=c[2].filter((_,j)=>answered('q'+(i*10+j))).length;document.querySelector('#part-count-'+i).textContent=n+'/10';if(i===part)document.querySelector('#section-count').textContent=n+' / 10 answered';});}if(view==='inventory')document.querySelector('#inventory-count').textContent=count('i',12)+' / 12 completed';if(view==='extra'){const section=extraPages[extraPart];document.querySelector('#extra-count').textContent=count('x'+extraPart+'-',section.prompts.length)+' / '+section.prompts.length+' answered';}});
let toastTimer;function notify(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3500);}
render();

</script></body></html>
